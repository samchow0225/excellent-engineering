<!DOCTYPE html>
<html lang="zh-Hant-HK">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>卓越機電工程有限公司 | Excellent E&M Engineering Ltd.</title>

<meta name="description"
content="香港電力及機電工程服務，包括高低壓配電系統、變壓器測試、保護繼電器測試及預防性維護。">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:"Microsoft JhengHei",Arial,sans-serif;

    background:
    linear-gradient(
        rgba(0,0,0,.65),
        rgba(0,0,0,.65)
    ),
    url("images/banner.jpg");

    background-size:cover;
    background-position:center;

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    color:white;

}

.container{

    max-width:700px;

    padding:40px;

}

.logo{

    font-size:3rem;
    font-weight:700;

    margin-bottom:15px;

}

.subtitle{

    font-size:1.2rem;

    margin-bottom:40px;

    opacity:.9;

}

.language-buttons{

    display:flex;
    justify-content:center;
    gap:20px;

    flex-wrap:wrap;

}

.btn{

    display:inline-block;

    min-width:180px;

    padding:16px 32px;

    border-radius:8px;

    background:#0078d4;

    color:white;

    text-decoration:none;

    font-size:18px;

    transition:.3s;

}

.btn:hover{

    background:#005ea6;

    transform:translateY(-3px);

}

.footer{

    position:fixed;

    bottom:20px;

    left:0;

    width:100%;

    text-align:center;

    font-size:14px;

    opacity:.8;

}

@media(max-width:768px){

    .logo{
        font-size:2rem;
    }

    .subtitle{
        font-size:1rem;
    }

    .btn{
        width:220px;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="logo">
        卓越機電工程有限公司
    </div>

    <div class="subtitle">
        Excellent E&M Engineering Ltd.
    </div>

    <div class="subtitle">
        高低壓配電系統｜變壓器測試｜保護繼電器測試｜預防性維護
    </div>

    <div class="language-buttons">

        <a class="btn" href="zh/">
            繁體中文
        </a>

        <a class="btn" href="en/">
            English
        </a>

    </div>

</div>

<div class="footer">
    © 2026 Excellent E&M Engineering Ltd.
</div>

</body>

</html>
